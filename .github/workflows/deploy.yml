name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a run in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # FIRST, before anything else: the repo's Pages "Source" was left on
      # "Deploy from a branch" (commit d063e68 told a human to set it that way,
      # 1d4a229 reverted the workflow but not the setting). In that mode GitHub's
      # Jekyll builder publishes the raw repo root — the dev index.html that
      # loads /src/main.tsx, which 404s -> black screen. Pin the source back to
      # "GitHub Actions" (build_type=workflow) on every run, before the Jekyll
      # builder for this same push can get ahead. GITHUB_TOKEN + `pages: write`
      # is enough for this endpoint; no PAT, no manual settings click.
      - name: Pin Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          api() {
            curl -sS -w '\n%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@" || true
          }
          resp=$(api -X PUT "https://api.github.com/repos/$REPO/pages" -d '{"build_type":"workflow"}')
          code=$(printf '%s' "$resp" | tail -n1)
          echo "PUT /pages -> $code"
          if [ "$code" = "404" ]; then
            resp=$(api -X POST "https://api.github.com/repos/$REPO/pages" -d '{"build_type":"workflow"}')
            code=$(printf '%s' "$resp" | tail -n1)
            echo "POST /pages -> $code"
          fi
          printf '%s\n' "$resp" | sed '$d'
          case "$code" in
            200|201|204) echo "Pages build_type = workflow" ;;
            *) echo "::warning::Could not pin Pages build_type (HTTP $code) — set Settings > Pages > Source to 'GitHub Actions' by hand" ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves the project at /<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
          VITE_APPS_SCRIPT_TOKEN: ${{ vars.VITE_APPS_SCRIPT_TOKEN }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Fail loudly if the served page is still the raw source tree.
      - name: Verify the built app is live
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$url" ]; then echo "::error::deploy-pages produced no page_url"; exit 1; fi
          echo "Checking $url"
          for i in $(seq 1 20); do
            body=$(curl -sSL --max-time 20 -H 'Cache-Control: no-cache' "${url}?ci=$(date +%s)" || true)
            if printf '%s' "$body" | grep -q 'src/main\.tsx'; then
              echo "attempt $i: still serving raw source, waiting..."
            elif printf '%s' "$body" | grep -q '/assets/index-'; then
              echo "OK: built bundle is being served"
              exit 0
            else
              echo "attempt $i: unexpected body, waiting..."
            fi
            sleep 15
          done
          echo "::error::Live site is not serving the built bundle."
          printf '%s\n' "$body" | head -40
          exit 1
