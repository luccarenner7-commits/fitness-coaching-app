name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Best-effort: try to pin the Pages source to "GitHub Actions" so
      # GitHub's Jekyll builder stops publishing the raw repo root (dev
      # index.html -> /src/main.tsx -> 404 -> black screen) and racing this
      # deploy. NOTE: the workflow GITHUB_TOKEN currently CANNOT flip an
      # already-branch-configured site to build_type=workflow via the API, so
      # this only helps if a repo admin has set Settings > Pages > Source to
      # "GitHub Actions" at least once. Left in place in case GitHub lifts
      # that API restriction. Never fails the run.
      - name: Try to pin Pages source to GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -o /dev/null -w 'PUT /pages -> %{http_code}\n' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X PUT "https://api.github.com/repos/$REPO/pages" \
            -d '{"build_type":"workflow"}' || true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
          VITE_APPS_SCRIPT_TOKEN: ${{ vars.VITE_APPS_SCRIPT_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Informational only: warns (does not fail) if the live URL is still
      # serving the raw source tree because the Jekyll builder won the race.
      - name: Check what is actually served
        continue-on-error: true
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          [ -z "$url" ] && { echo "no page_url"; exit 0; }
          sleep 20
          body=$(curl -sSL --max-time 20 -H 'Cache-Control: no-cache' "${url}?ci=$(date +%s)" || true)
          if printf '%s' "$body" | grep -q '/assets/index-'; then
            echo "OK: built bundle is being served"
          else
            echo "::warning::Live site is serving the raw source, not the build. Set Settings > Pages > Source to 'GitHub Actions' (one-time) to stop GitHub's Jekyll builder from racing this deploy."
          fi
