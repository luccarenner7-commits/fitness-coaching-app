name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a run in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves the project at /<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
          VITE_APPS_SCRIPT_TOKEN: ${{ vars.VITE_APPS_SCRIPT_TOKEN }}

      # The repo's Pages "Source" keeps getting left on / reverting to
      # "Deploy from a branch", which publishes the raw repo root (the dev
      # index.html that loads /src/main.tsx -> 404 -> black screen). Force it
      # back to "GitHub Actions" (build_type=workflow) on every run so the
      # deploy below is what actually gets served. Non-fatal if the API call
      # can't run for some reason.
      - name: Force Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          api() {
            curl -sS -w '\n%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          resp=$(api -X PUT "https://api.github.com/repos/$REPO/pages" -d '{"build_type":"workflow"}')
          code=$(printf '%s' "$resp" | tail -n1)
          echo "PUT /pages -> $code"
          if [ "$code" = "404" ]; then
            resp=$(api -X POST "https://api.github.com/repos/$REPO/pages" -d '{"build_type":"workflow"}')
            code=$(printf '%s' "$resp" | tail -n1)
            echo "POST /pages -> $code"
          fi
          printf '%s\n' "$resp" | sed '$d'
          case "$code" in
            200|201|204) echo "Pages build_type = workflow" ;;
            *) echo "::warning::Could not set Pages build_type (HTTP $code) — set Settings > Pages > Source to 'GitHub Actions' by hand" ;;
          esac

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Fail loudly if the served page is still the raw source tree.
      - name: Verify the built app is live
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for i in $(seq 1 10); do
            body=$(curl -sSL "$url" || true)
            if printf '%s' "$body" | grep -q '/assets/index-'; then
              echo "OK: built bundle is being served"
              exit 0
            fi
            echo "attempt $i: not the built bundle yet, waiting..."
            sleep 15
          done
          echo "::error::Live site is still serving the raw source (no /assets/ bundle)."
          printf '%s\n' "$body" | head -40
          exit 1
