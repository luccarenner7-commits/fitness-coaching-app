name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needs write access to push the built site to the `gh-pages` branch.
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves the project under /<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
          VITE_APPS_SCRIPT_TOKEN: ${{ vars.VITE_APPS_SCRIPT_TOKEN }}

      # Publish the built site to the `gh-pages` branch.
      #
      # Pages must be set to: Settings -> Pages -> Build and deployment ->
      # Source = "Deploy from a branch", Branch = gh-pages, folder = / (root).
      #
      # Why a real branch instead of the "GitHub Actions" Pages source:
      # GitHub's built-in Jekyll page builder kept re-publishing the *repo
      # root* of main (the raw dev index.html that points at /src/main.tsx),
      # which 404s and shows a black screen. Serving a dedicated branch that
      # already contains the finished build removes that race for good.
      # dist/.nojekyll tells the builder to copy the files as-is.
      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
