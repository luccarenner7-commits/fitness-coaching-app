name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The repo's Pages "Source" was left on "Deploy from a branch", so
      # GitHub's Jekyll builder publishes the raw repo root (dev index.html ->
      # /src/main.tsx -> 404 -> black screen) and races/overwrites this
      # workflow's deploy. Pin the source to "GitHub Actions" via the API and
      # HARD FAIL if it doesn't take, so we get a clear signal instead of a
      # silently-lost race.
      - name: Pin Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          put_code=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT "https://api.github.com/repos/$REPO/pages" "${hdr[@]}" -d '{"build_type":"workflow"}' || echo 000)
          echo "PUT /pages -> $put_code"; cat /tmp/put.json; echo
          if [ "$put_code" = "404" ]; then
            post_code=$(curl -sS -o /tmp/post.json -w '%{http_code}' -X POST "https://api.github.com/repos/$REPO/pages" "${hdr[@]}" -d '{"build_type":"workflow"}' || echo 000)
            echo "POST /pages -> $post_code"; cat /tmp/post.json; echo
          fi

          get_code=$(curl -sS -o /tmp/get.json -w '%{http_code}' "https://api.github.com/repos/$REPO/pages" "${hdr[@]}" || echo 000)
          echo "GET /pages -> $get_code"; cat /tmp/get.json; echo
          bt=$(grep -o '"build_type"[^,}]*' /tmp/get.json || true)
          echo "current $bt"
          case "$bt" in
            *workflow*) echo "Pages source is GitHub Actions — good" ;;
            *) echo "::error::Pages source is NOT 'workflow' ($bt). The API pin did not stick — a repo admin must set Settings > Pages > Source = 'GitHub Actions' once."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
          VITE_APPS_SCRIPT_TOKEN: ${{ vars.VITE_APPS_SCRIPT_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the built app is live
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$url" ]; then echo "::error::deploy-pages produced no page_url"; exit 1; fi
          echo "Checking $url"
          for i in $(seq 1 20); do
            body=$(curl -sSL --max-time 20 -H 'Cache-Control: no-cache' "${url}?ci=$(date +%s)" || true)
            if printf '%s' "$body" | grep -q 'src/main\.tsx'; then
              echo "attempt $i: still serving raw source, waiting..."
            elif printf '%s' "$body" | grep -q '/assets/index-'; then
              echo "OK: built bundle is being served"; exit 0
            else
              echo "attempt $i: unexpected body, waiting..."
            fi
            sleep 15
          done
          echo "::error::Live site is not serving the built bundle."
          printf '%s\n' "$body" | head -40
          exit 1
